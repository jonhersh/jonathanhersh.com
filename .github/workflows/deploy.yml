name: Deploy to Cloudflare

# Pushes to main build the static export and ship it. Before this existed the
# site was deployed by running `npx wrangler deploy` by hand, so a push could
# (and did) leave production months behind the repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; a queued one supersedes the one waiting.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Fail loudly here rather than deploying an empty directory, which
      # Cloudflare would happily accept and serve as a blank site. Next's
      # static export writes route pages as `<route>.html` (no trailingSlash),
      # so the research listing is out/research.html — not research/index.html.
      - name: Verify the export produced pages
        run: |
          set -euo pipefail
          for f in out/index.html out/research.html out/about.html out/llms.txt out/sitemap.xml; do
            [ -s "$f" ] || { echo "::error::missing or empty: $f"; exit 1; }
          done
          papers=$(find out/research -name '*.html' | wc -l)
          echo "paper pages: $papers"
          [ "$papers" -ge 12 ] || { echo "::error::expected >=12 paper pages, got $papers"; exit 1; }

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
